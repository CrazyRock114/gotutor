# Gotutor — human-SL 对弈引擎配置
# 基于 KataGo 官方 analysis_example 裁剪;与 analysis.cfg 的差异:
#   ignorePreRootHistory = false(human-SL 官方指导:人类模型需要完整历史)
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 2
ignorePreRootHistory = false
reportAnalysisWinratesAs = SIDETOMOVE
maxVisits = 500
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
