# Gotutor — KataGo 分析引擎配置
# 基于 KataGo v1.18 官方 configs/analysis_example.cfg,针对 Apple Silicon(Metal)+ 8GB RAM 调整。
# 无 logDir → 日志走 stderr,由后端进程接管。

# 胜率/目差以"行棋方"视角输出(rootInfo.winrate),与后端换算逻辑一致
reportAnalysisWinratesAs = SIDETOMOVE

# 每查询默认访问量上限(可被请求里的 maxVisits 覆盖)
maxVisits = 500

# 本服务内部查询串行,单个查询给 4 个搜索线程,响应更快
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 4

# GPU 批量与缓存(8GB 内存保守值)
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
